# ==============================================================================
# Network Monitor - Configured Hosts and Services
# ==============================================================================
# Format:
# host.<id>.name=<Friendly Name>
# host.<id>.address=<Hostname or IP Address>
# host.<id>.port=<TCP Port (1-65535) or 0 for ICMP Ping only>
# host.<id>.service=<Service Name>
# host.<id>.interval=<Check Interval in Seconds>
# host.<id>.timeout=<Connection Timeout in Milliseconds>
# host.<id>.enabled=<true|false>
# ==============================================================================

# Public DNS Services
host.1.name=Google Public DNS
host.1.address=8.8.8.8
host.1.port=53
host.1.service=DNS Service
host.1.interval=5
host.1.timeout=2500
host.1.enabled=true

host.2.name=Cloudflare DNS
host.2.address=1.1.1.1
host.2.port=53
host.2.service=DNS Service
host.2.interval=5
host.2.timeout=2500
host.2.enabled=true

# Public Web Services
host.3.name=Google Web
host.3.address=google.com
host.3.port=443
host.3.service=HTTPS Web
host.3.interval=5
host.3.timeout=3000
host.3.enabled=true

# Localhost Loopback Services
host.4.name=Localhost Echo
host.4.address=127.0.0.1
host.4.port=0
host.4.service=Local Ping
host.4.interval=5
host.4.timeout=1500
host.4.enabled=true

host.5.name=Local Dev Web Server
host.5.address=127.0.0.1
host.5.port=8080
host.5.service=HTTP Dev Server
host.5.interval=5
host.5.timeout=1500
host.5.enabled=true
